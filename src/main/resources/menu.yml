# ==========================================================
#  Housing — Mode Selection Menu
#  Version: 1.0
#  Theme: Aqua + White
# ==========================================================
#  AUTO-MERGED on plugin update. Existing values are preserved.
#
#  Placeholders available in name/lore:
#    %player%  → player name
# ==========================================================

# ----------------------------------------------------------
#  Menu Item (given to player in their hotbar)
#  Right-click it to open the mode selection GUI.
# ----------------------------------------------------------
item:
  # Should the menu item be given on join/respawn?
  enabled: true

  # Hotbar slot (0-8). Default = 8 (last slot).
  slot: 8

  # Material for the item.
  # 1.8.8 compatible: COMPASS, NETHER_STAR, BOOK, etc.
  material: COMPASS

  # Display name
  name: '&b&l✦ Mode Selector ✦'

  # Lore (each line separate). Use '&' for color codes.
  lore:
    - '&7Right-click to open the'
    - '&7mode selection menu.'
    - ''
    - '&bAvailable Modes:'
    - '&f• &bPlatform'
    - '&f• &bLowMid'
    - '&f• &bOneWide'
    - '&f• &bBlockFight'

  # Should the item glow (enchantment effect)? (1.8.8 compatible)
  glow: true

  # Hide all vanilla attributes (1.8.8 compatible)
  hide-attributes: true

# ----------------------------------------------------------
#  Menu GUI
# ----------------------------------------------------------
gui:
  # Title of the inventory
  title: '&8&lSelect a Game Mode'

  # Inventory size (must be multiple of 9): 9, 18, 27, 36, 45, 54
  size: 27

  # Fill empty slots with this material (use AIR to skip)
  filler-material: 'STAINED_GLASS_PANE'
  filler-data: 7
  filler-name: ' '

  # Should players be able to close with ESC?
  close-with-esc: true

  # Play sound on open?
  sound-open: true
  sound-open-name: 'CLICK'
  sound-open-volume: 1.0
  sound-open-pitch: 1.5

  # Play sound on mode click?
  sound-click: true
  sound-click-name: 'LEVEL_UP'
  sound-click-volume: 1.0
  sound-click-pitch: 1.2

# ----------------------------------------------------------
#  Mode Buttons
#  Each mode has a slot in the GUI.
# ----------------------------------------------------------
buttons:
  platform:
    # GUI slot (0-based, relative to GUI size)
    slot: 10
    material: 'GRASS'
    data: 0
    name: '&b&lPlatform'
    lore:
      - '&7The classic PvP platform.'
      - '&7Cosmetic damage, no death.'
      - ''
      - '&eClick to join!'
    # Enchantment glow
    glow: false

  lowmid:
    slot: 12
    material: 'IRON_CHESTPLATE'
    data: 0
    name: '&b&lLowMid'
    lore:
      - '&7Leather armor + iron legs.'
      - '&7Real PvP damage enabled.'
      - ''
      - '&eClick to join!'
    glow: false

  onewide:
    slot: 14
    material: 'IRON_SWORD'
    data: 0
    name: '&b&lOneWide'
    lore:
      - '&7Narrow bridge PvP.'
      - '&7Cosmetic damage, no death.'
      - ''
      - '&eClick to join!'
    glow: false

  blockfight:
    slot: 16
    material: 'DIAMOND_SWORD'
    data: 0
    name: '&b&lBlockFight'
    lore:
      - '&7Wool-based combat.'
      - '&7Cosmetic damage, no death.'
      - ''
      - '&eClick to join!'
    glow: true

# ----------------------------------------------------------
#  Close Button
# ----------------------------------------------------------
close-button:
  # Set to false to remove the close button entirely
  enabled: true
  slot: 22
  material: 'BARRIER'
  data: 0
  name: '&c&lClose'
  lore:
    - '&7Click to close this menu.'

# ----------------------------------------------------------
#  Extra decorative slots
#  Any slot not used by a button or close-button will be
#  filled with the filler material above.
# ----------------------------------------------------------