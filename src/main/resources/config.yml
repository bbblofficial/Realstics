# ==========================================================
#  Housing Configuration — Platform (default mode)
#  Version: 1.0
# ==========================================================
#  AUTO-MERGED on plugin update. Existing values are preserved.
# ==========================================================

# ----------------------------------------------------------
#  Spawn (Platform mode)
#  Set with: /housing platform setspawn
# ----------------------------------------------------------
spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ----------------------------------------------------------
#  Void (Platform)
#  Set with: /housing platform setvoid [y]
# ----------------------------------------------------------
void:
  kill-height: -13.0

# ----------------------------------------------------------
#  Combo System (global — all modes)
#  Placeholders: %combo%, %attacker%, %victim%
#  Use "\n" inside double quotes for a new line.
# ----------------------------------------------------------
combo:
  enabled: true
  step: 10
  reset-time: 3000
  sound-enabled: true
  broadcast-message: "&b&m-------------------------------\n&bCOMBO &f%combo%x\n&b%attacker% &fcomboed &b%victim% &7(&f%combo% &7combo)\n&b&m-------------------------------"

# ----------------------------------------------------------
#  Scoreboard (global)
# ----------------------------------------------------------
scoreboard:
  update-interval: 10

# ----------------------------------------------------------
#  Join / Quit messages (global — all modes)
#  Placeholders: %player%, %online%, %max_online%
# ----------------------------------------------------------
join-message: '&b%player% &fjoined the game &7(&b%online%&7/&b%max_online%&7)'
quit-message: '&b%player% &fleft the game &7(&b%online%&7/&b%max_online%&7)'

# ----------------------------------------------------------
#  PvP Zone (Platform only)
#  PvP is enabled only when the attacker's X >= pvpzone.x
#  Set with: /housing platform setpvpzone [x]
# ----------------------------------------------------------
pvpzone:
  enabled: true
  x: 0.0

# ----------------------------------------------------------
#  Protection
#  locked-world: the DEFAULT world. It is:
#    - The destination of /housing (no args)
#    - NEVER modifiable (no break/place)
# ----------------------------------------------------------
protection:
  # The world that must NEVER be modified (no break/place).
  # This is also the DEFAULT world for /housing (no args).
  locked-world: "world"

  # Auto-remove player-placed blocks after this many seconds.
  # Applies to every non-locked world.
  placed-decay-seconds: 5

  # Reserved for future use — natural block restore delay.
  natural-restore-seconds: 9

  # ------------------------------------------------------
  #  Block Freeze — prevents stack size from decreasing
  # ------------------------------------------------------
  # When a player places a block, the stack in their hand
  # is restored to its ORIGINAL size (e.g. 64) instead of
  # decreasing.
  #
  # Example: player has 64 wool → places 1 → still 64 wool.
  # ------------------------------------------------------
  block-freeze:
    # Master switch for the block-freeze feature.
    enabled: true

    # Force the hand stack back to this size after placing.
    # Set to -1 to restore to the ORIGINAL stack size instead
    # of a fixed value.
    force-stack-size: -1

    # Players with this permission bypass the freeze and lose
    # items normally when placing blocks.
    bypass-permission: "housing.bypass.freeze"

# ----------------------------------------------------------
#  Mode Selection Menu
#  - The item itself and the GUI are configured in menu.yml
#  - This section only controls a global on/off switch
# ----------------------------------------------------------
menu:
  enabled: true

# ----------------------------------------------------------
#  World -> Game Mode mapping
#  Valid modes: platform, lowmid, onewide, blockfight
#  Assign with: /housing setworld [world] <mode>
#
#  IMPORTANT:
#    - "world" (the locked-world above) MUST be mapped to platform
#    - Each mode SHOULD have exactly ONE world mapped to it
#    - Do NOT map two worlds to the same mode
# ----------------------------------------------------------
worlds:
  world: platform