# ==========================================================
#  Housing Configuration — Platform (default mode)
#  Version: 1.0
# ==========================================================
#  AUTO-MERGED on plugin update. Existing values are preserved.
# ==========================================================

# ----------------------------------------------------------
#  Spawn (Platform mode)
#  Set with: /housing platform setspawn
# ----------------------------------------------------------
spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ----------------------------------------------------------
#  Void (Platform)
#  Set with: /housing platform setvoid [y]
# ----------------------------------------------------------
void:
  kill-height: -13.0

# ----------------------------------------------------------
#  Combo System (global — all modes)
#  Placeholders: %combo%, %attacker%, %victim%
#  Use "\n" inside double quotes for a new line.
# ----------------------------------------------------------
combo:
  enabled: true
  step: 10
  reset-time: 3000
  sound-enabled: true
  broadcast-message: "&b&m-------------------------------\n&bCOMBO &f%combo%x\n&b%attacker% &fcomboed &b%victim% &7(&f%combo% &7combo)\n&b&m-------------------------------"

# ----------------------------------------------------------
#  Scoreboard (global)
# ----------------------------------------------------------
scoreboard:
  update-interval: 10

# ----------------------------------------------------------
#  Join / Quit messages (global — all modes)
#  Placeholders: %player%, %online%, %max_online%
# ----------------------------------------------------------
join-message: '&b%player% &fjoined the game &7(&b%online%&7/&b%max_online%&7)'
quit-message: '&b%player% &fleft the game &7(&b%online%&7/&b%max_online%&7)'

# ----------------------------------------------------------
#  Death Messages (global)
#  Placeholders: %victim%, %killer%, %world%
# ----------------------------------------------------------
death:
  # Enable custom death messages? (If false, vanilla messages are used)
  enabled: true

  # Default death message (no killer)
  default: '&c%victim% &7died'

  # Killed by another player
  killed-by-player: '&c%victim% &7was slain by &c%killer%'

  # Killed by a mob / entity
  killed-by-mob: '&c%victim% &7was killed by &c%killer%'

  # ★ Respawn behavior
  #  true  → player respawns in the SAME world they died in
  #          (only for modes with real damage — LowMid)
  #  false → player always respawns in the lobby (Platform)
  respawn-in-same-world: true

  # Modes where players CAN actually die (real damage).
  # If a player dies in one of these modes, they respawn there.
  # Any other mode → they respawn in the lobby.
  real-damage-modes:
    - lowmid

# ----------------------------------------------------------
#  PvP Zone (Platform only)
#  PvP is enabled only when the attacker's X >= pvpzone.x
#  Set with: /housing platform setpvpzone [x]
# ----------------------------------------------------------
pvpzone:
  enabled: true
  x: 0.0

# ----------------------------------------------------------
#  Protection
#  locked-world: the DEFAULT world. It is:
#    - The destination of /housing (no args)
#    - NEVER modifiable (no break/place)
# ----------------------------------------------------------
protection:
  # The world that must NEVER be modified (no break/place).
  # This is also the DEFAULT world for /housing (no args).
  locked-world: "world"

  # Auto-remove player-placed blocks after this many seconds.
  # Applies to every non-locked world.
  placed-decay-seconds: 5

  # Reserved for future use — natural block restore delay.
  natural-restore-seconds: 9

  # ------------------------------------------------------
  #  Block Freeze — prevents stack size from decreasing
  # ------------------------------------------------------
  block-freeze:
    # Master switch for the block-freeze feature.
    enabled: true

    # Force the hand stack back to this size after placing.
    # Set to -1 to restore to the ORIGINAL stack size.
    force-stack-size: -1

    # ★ Apply the freeze to EVERYONE (including OP and
    #   permission holders).
    #   true  → OP and permission holders KEEP their blocks
    #   false → OP and permission holders LOSE their blocks
    apply-to-everyone: true

    # ★ Permissions that can bypass the freeze.
    #   Only used when `apply-to-everyone` is FALSE.
    bypass-permissions:
      - "housing.bypass.freeze"

# ----------------------------------------------------------
#  Mode Selection Menu
#  - The item itself and the GUI are configured in menu.yml
#  - This section only controls a global on/off switch
# ----------------------------------------------------------
menu:
  enabled: true

# ----------------------------------------------------------
#  World -> Game Mode mapping
#  Valid modes: platform, lowmid, onewide, blockfight
#  Assign with: /housing setworld [world] <mode>
#
#  IMPORTANT:
#    - "world" MUST be mapped to platform (default world)
#    - Each mode should have exactly ONE world
#    - Do NOT map a world named "platform" to Platform mode
# ----------------------------------------------------------
worlds:
  world: platform
  blockfight: blockfight
  lowmid: lowmid
  onewide: onewide