# ==========================================================
#  Housing Configuration — Platform (default mode)
#  Version: 1.0
#  Theme: Aqua + White
# ==========================================================
#  AUTO-MERGED on plugin update. Existing values are preserved.
# ==========================================================

# ----------------------------------------------------------
#  Spawn (Platform mode)
#  Set with: /housing platform setspawn
# ----------------------------------------------------------
spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ----------------------------------------------------------
#  Void (Platform)
#  Set with: /housing platform setvoid [y]
# ----------------------------------------------------------
void:
  kill-height: -13.0

# ----------------------------------------------------------
#  Combo System (global — all modes)
#  Placeholders: %combo%, %attacker%, %victim%
#  Use "\n" inside double quotes for a new line.
# ----------------------------------------------------------
combo:
  enabled: true
  step: 10
  reset-time: 3000
  sound-enabled: true
  broadcast-message: "&b&m-------------------------------\n&bCOMBO &f%combo%x\n&b%attacker% &fcomboed &b%victim% &7(&f%combo% &7combo)\n&b&m-------------------------------"

# ----------------------------------------------------------
#  Scoreboard (global)
# ----------------------------------------------------------
scoreboard:
  update-interval: 10

# ----------------------------------------------------------
#  Join / Quit messages (global — all modes)
#  Placeholders: %player%, %online%, %max_online%
# ----------------------------------------------------------
join-message: '&b%player% &fjoined the game &7(&b%online%&7/&b%max_online%&7)'
quit-message: '&b%player% &fleft the game &7(&b%online%&7/&b%max_online%&7)'

# ----------------------------------------------------------
#  PvP Zone (Platform only)
#  PvP is enabled only when the attacker's X >= pvpzone.x
#  Set with: /housing platform setpvpzone [x]
# ----------------------------------------------------------
pvpzone:
  enabled: true
  x: 0.0

# ----------------------------------------------------------
#  Protection
#  - locked-world: هیچ بلوکی نمی‌تونه گذاشته یا شکسته بشه
#                  (به جز پلیر با perm housing.bypass)
#  - All placed blocks in other worlds are auto-removed
#    after `placed-decay-seconds` seconds.
# ----------------------------------------------------------
protection:
  # The world that must NEVER be modified (no break/place).
  # Typically the main lobby/main world.
  locked-world: "world"

  # Auto-remove player-placed blocks after this many seconds.
  # Applies to every non-locked world.
  placed-decay-seconds: 5

  # Natural blocks placed by the world itself are NOT restored.
  # This is the delay for natural block restore (unused for now,
  # reserved for future use).
  natural-restore-seconds: 9

# ----------------------------------------------------------
#  World -> Game Mode mapping
#  Valid modes: platform, lowmid, onewide, blockfight
#  Assign with: /housing setworld [world] <mode>
# ----------------------------------------------------------
worlds:
  world: platform